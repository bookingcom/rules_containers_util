name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel previous runs of the same PR or branch, except on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.ref_name == 'main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-endpoint: ${{ vars.BUILDBUDDY_ENDPOINT }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build
        run: bazel --bazelrc=.github/workflows/ci.bazelrc build //...
      - name: Test
        run: bazel --bazelrc=.github/workflows/ci.bazelrc test //...
      - name: Build dockerfile_parser dist
        run: |
          rm -rf dist && mkdir -p dist
          bazel --bazelrc=.github/workflows/ci.bazelrc build -c opt //cmd/dockerfile_parser:dist
          cp -f -L bazel-bin/cmd/dockerfile_parser/dockerfile_parser-*.tar.gz dist/
      - name: Run e2e tests
        working-directory: e2e/dnf-hermetic-lock
        run: |
          bazel --bazelrc=../../.github/workflows/ci.bazelrc test //... \
            --repo_env=DOCKERFILE_PARSER_DIST_DIR=${{ github.workspace }}/dist
      - name: Upload JSON artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-json-artifacts
          path: |
            **/*.lock.json
            **/*ast.json
            bazel-testlogs/**/test.outputs/*
            bazel-testlogs/**/*.json
            e2e/**/test.outputs/*
            e2e/**/artifacts/**/*.json
          if-no-files-found: ignore

  buildifier:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Starlark formatting
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /usr/local/bin/buildifier \
            https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/buildifier-linux-amd64
          chmod +x /usr/local/bin/buildifier
          git ls-files '*.bazel' '*.bzl' | xargs -r buildifier -mode=check -lint=warn
