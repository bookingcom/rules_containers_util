name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel previous runs of the same PR or branch, except on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.ref_name == 'main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      BUILDBUDDY_ENDPOINT: ${{ vars.BUILDBUDDY_ENDPOINT }}
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ env.BUILDBUDDY_ENDPOINT == '' || env.BUILDBUDDY_API_KEY == '' }}
      - name: Configure remote cache
        if: env.BUILDBUDDY_ENDPOINT != '' && env.BUILDBUDDY_API_KEY != ''
        run: |
          {
            echo "common --config=buildbuddy"
            echo "common:buildbuddy --bes_backend=grpcs://${BUILDBUDDY_ENDPOINT}"
            echo "common:buildbuddy --bes_results_url=https://${BUILDBUDDY_ENDPOINT}/invocation/"
            echo "common:buildbuddy --remote_cache=grpcs://${BUILDBUDDY_ENDPOINT}"
            echo "common:buildbuddy --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
          } > .bazelrc.user
      - name: Build
        run: bazel --bazelrc=.github/workflows/ci.bazelrc build //...
      - name: Test
        run: bazel --bazelrc=.github/workflows/ci.bazelrc test //...
      - name: Build dockerfile_parser dist
        run: |
          rm -rf dist && mkdir -p dist
          bazel --bazelrc=.github/workflows/ci.bazelrc build -c opt //cmd/dockerfile_parser:dist
          cp -f -L bazel-bin/cmd/dockerfile_parser/dockerfile_parser-*.tar.gz dist/
      - name: Run e2e tests
        working-directory: e2e/dnf-hermetic-lock
        run: |
          bazel --bazelrc=../../.github/workflows/ci.bazelrc test //... \
            --repo_env=DOCKERFILE_PARSER_DIST_DIR=${{ github.workspace }}/dist
      - name: Upload JSON artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-json-artifacts
          path: |
            **/*.lock.json
            **/*ast.json
            bazel-testlogs/**/test.outputs/*
            bazel-testlogs/**/*.json
            e2e/**/test.outputs/*
            e2e/**/artifacts/**/*.json
          if-no-files-found: ignore

  buildifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Starlark formatting
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /usr/local/bin/buildifier \
            https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/buildifier-linux-amd64
          chmod +x /usr/local/bin/buildifier
          git ls-files '*.bazel' '*.bzl' | xargs -r buildifier -mode=check -lint=warn
