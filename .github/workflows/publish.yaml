# Publish new releases to the Bazel Central Registry.
name: Publish

on:
  # Run after a successful release (release.yml).
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      templates_ref:
        required: false
        type: string
    secrets:
      BCR_PUBLISH_TOKEN:
        required: true
  # Let release engineers retry from the GitHub UI.
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string
      templates_ref:
        description: "Git ref to read .bcr templates from (e.g. main)"
        required: false
        type: string

jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@1a42c3dca6566cf3a07689768259f1a35066ed01 # v0.2.3
    with:
      tag_name: ${{ inputs.tag_name }}
      templates_ref: ${{ inputs.templates_ref }}
      # Fork of bazelbuild/bazel-central-registry the pull request is opened from.
      registry_fork: bookingcom/bazel-central-registry
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
