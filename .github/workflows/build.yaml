# Builds the dockerfile_parser distribution archive of every supported platform.
# Reused by ci.yaml and release.yml.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout
        required: false
        type: string
        default: ""
      version:
        description: Version to stamp into archives (defaults to DEFAULT_VERSION)
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Build
        run: |
          mkdir -p dist
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          BAZEL_ARGS=()
          if [ -n "$VERSION" ]; then
            BAZEL_ARGS+=("--//cmd/dockerfile_parser:version=${VERSION}" "--define=version=${VERSION}")
          fi
          bazel --bazelrc=.github/workflows/ci.bazelrc build -c opt "${BAZEL_ARGS[@]}" //cmd/dockerfile_parser:dist
          cp -L bazel-bin/cmd/dockerfile_parser/dockerfile_parser-*.tar.gz dist/
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dockerfile_parser
          path: dist/*.tar.gz
          if-no-files-found: error
