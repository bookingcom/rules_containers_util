# Builds the dockerfile_parser distribution archive of every supported platform.
# Reused by ci.yaml and release.yml.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout
        required: false
        type: string
        default: ""
      version:
        description: Version to stamp into archives (defaults to DEFAULT_VERSION)
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Build
        run: |
          mkdir -p dist
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          BAZEL_ARGS=()
          if [ -n "$VERSION" ]; then
            BAZEL_ARGS+=("--//cmd/dockerfile_parser:version=${VERSION}" "--define=version=${VERSION}")
          fi
          bazel --bazelrc=.github/workflows/ci.bazelrc build -c opt "${BAZEL_ARGS[@]}" //cmd/dockerfile_parser:dist
          cp -L bazel-bin/cmd/dockerfile_parser/dockerfile_parser-*.tar.gz dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dockerfile_parser
          path: dist/*.tar.gz
          if-no-files-found: error
