# Builds the dockerfile_parser distribution archive of every supported platform.
# Reused by ci.yaml and release.yml.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout
        required: false
        type: string
        default: ""
      version:
        description: Version to stamp into archives (defaults to DEFAULT_VERSION)
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-endpoint: ${{ vars.BUILDBUDDY_ENDPOINT }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build
        run: |
          mkdir -p dist
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          BAZEL_ARGS=()
          if [ -n "$VERSION" ]; then
            BAZEL_ARGS+=("--//cmd/dockerfile_parser:version=${VERSION}" "--define=version=${VERSION}")
          fi
          bazel --bazelrc=.github/workflows/ci.bazelrc build -c opt "${BAZEL_ARGS[@]}" //cmd/dockerfile_parser:dist
          cp -L bazel-bin/cmd/dockerfile_parser/dockerfile_parser-*.tar.gz dist/
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dockerfile_parser
          path: dist/*.tar.gz
          if-no-files-found: error
